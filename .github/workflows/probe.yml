name: probe-eis
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка доступа к ЕИС с раннера GitHub
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0"
          URL="https://zakupki.gov.ru/epz/order/extendedsearch/results.html?fz44=on&af=on&priceFromGeneral=100000&priceToGeneral=2000000&recordsPerPage=_50"
          code=$(curl -s -o out.html -w "%{http_code}" --max-time 40 -A "$UA" "$URL" || echo "fail")
          echo "HTTP: $code, размер: $(wc -c < out.html) байт"
          grep -c "search-registry-entry-block" out.html || echo "карточек не найдено"
